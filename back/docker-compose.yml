services:
  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-war-archive}-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: war-archive-backend:local
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Seoul}
      ADMIN_PORT: 9231
      WAR_ARCHIVE_ADMIN_TOKEN: ${WAR_ARCHIVE_ADMIN_TOKEN:?WAR_ARCHIVE_ADMIN_TOKEN must be set in .env}
      WAR_ARCHIVE_DATA_ROOT: /data
      COLLECTION_INTERVAL_MS: ${COLLECTION_INTERVAL_MS:-600000}
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-600000}
      PUBLICATION_INTERVAL_MS: ${PUBLICATION_INTERVAL_MS:-3600000}
      COLLECTION_MAX_ITEMS_PER_SOURCE: ${COLLECTION_MAX_ITEMS_PER_SOURCE:-100}
      PUBLICATION_MIN_QUALITY_SCORE: ${PUBLICATION_MIN_QUALITY_SCORE:-0.6}
      SCHEDULER_RETRY_MS: ${SCHEDULER_RETRY_MS:-60000}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-60000}
      MONITOR_FAILURE_THRESHOLD: ${MONITOR_FAILURE_THRESHOLD:-3}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      GITHUB_FRONT_REPOSITORY: ${GITHUB_FRONT_REPOSITORY:-kenitoa/warsachive}
      GITHUB_FRONT_TOKEN: ${GITHUB_FRONT_TOKEN:?GITHUB_FRONT_TOKEN must be set in .env}
      GITHUB_FRONT_REF: ${GITHUB_FRONT_REF:-main}
      GITHUB_FRONT_ARCHIVE_DIR: ${GITHUB_FRONT_ARCHIVE_DIR:-web/content/archive}
      SMITHSONIAN_API_KEY: ${SMITHSONIAN_API_KEY:-}
      EUROPEANA_API_KEY: ${EUROPEANA_API_KEY:-}
      DPLA_API_KEY: ${DPLA_API_KEY:-}
    volumes:
      - archive-data:/data
    ports:
      - "${ADMIN_PORT:-9231}:9231"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9231/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  archive-data:
    name: ${COMPOSE_PROJECT_NAME:-war-archive}_data
